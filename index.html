<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Chuyên Đề 1: Phân Bón - GV Nguyễn Vỹ</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace']
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      .print-full { width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
    /* Hide scrollbar for clean horizontal nav on mobile */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Custom scrollbars for desktop */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col selection:bg-emerald-200 selection:text-emerald-900">

  <!-- TOP HEADER / BANNER -->
  <header class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white shadow-lg border-b border-emerald-700/50">
    <div class="max-w-6xl mx-auto px-4 py-5 sm:px-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-700/60 text-emerald-200 text-xs font-bold uppercase tracking-wider mb-2 border border-emerald-500/30">
            🌱 HÓA HỌC CHUYÊN ĐỀ HỌC TẬP
          </div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
            CHUYÊN ĐỀ 1: PHÂN BÓN
          </h1>
          <div class="mt-3">
            <span class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-xl bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-400 text-slate-900 font-extrabold text-base shadow-lg shadow-amber-500/25 border-2 border-yellow-100 ring-2 ring-amber-400/40">
              <span class="text-lg">👨‍🏫</span>
              <span class="tracking-wide text-emerald-950 font-black">GV NGUYỄN VỸ</span>
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-800"></span>
              <span class="text-xs font-bold text-emerald-900 uppercase tracking-wider bg-amber-200/80 px-2 py-0.5 rounded-md">Biên soạn</span>
            </span>
          </div>
        </div>

        <!-- Student worksheet info (auto saved, mobile optimized) -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-4 border border-white/20 text-xs sm:text-sm grid grid-cols-1 sm:grid-cols-3 gap-2.5 sm:gap-3 w-full md:w-auto md:min-w-[420px] no-print">
          <div>
            <label class="block text-emerald-200 text-[11px] font-bold uppercase tracking-wider mb-1">Học sinh</label>
            <input type="text" id="studentName" placeholder="Nhập họ và tên..." class="bg-black/25 text-white rounded-xl px-3 py-2 w-full text-base sm:text-xs placeholder:text-emerald-200/50 focus:outline-none focus:ring-2 focus:ring-amber-300 border border-white/10">
          </div>
          <div>
            <label class="block text-emerald-200 text-[11px] font-bold uppercase tracking-wider mb-1">Lớp</label>
            <input type="text" id="studentClass" placeholder="Ví dụ: 11A1, 12A..." class="bg-black/25 text-white rounded-xl px-3 py-2 w-full text-base sm:text-xs placeholder:text-emerald-200/50 focus:outline-none focus:ring-2 focus:ring-amber-300 border border-white/10">
          </div>
          <div>
            <label class="block text-emerald-200 text-[11px] font-bold uppercase tracking-wider mb-1">Trường</label>
            <input type="text" id="studentSchool" placeholder="Tên trường THPT..." class="bg-black/25 text-white rounded-xl px-3 py-2 w-full text-base sm:text-xs placeholder:text-emerald-200/50 focus:outline-none focus:ring-2 focus:ring-amber-300 border border-white/10">
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- QUICK STATS BAR (MOBILE & DESKTOP COMPACT) -->
  <section class="bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm no-print sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-3.5 py-2 sm:px-6">
      <div class="flex items-center justify-between gap-2 text-xs sm:text-sm">
        <div class="flex items-center gap-3 sm:gap-5 overflow-x-auto no-scrollbar py-0.5 font-semibold text-slate-700 shrink">
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="hidden sm:inline text-slate-500">Tổng:</span>
            <span id="statTotalQuestions" class="font-bold text-slate-900">79</span> <span class="text-[11px] text-slate-400">câu</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-teal-500"></span>
            <span class="hidden sm:inline text-slate-500">Đã làm:</span>
            <span id="statAnswered" class="font-bold text-slate-900">0</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            <span class="hidden sm:inline text-slate-500">Đúng:</span>
            <span id="statAccuracy" class="font-bold text-emerald-700">0%</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="w-2 h-2 rounded-full bg-rose-500"></span>
            <span class="hidden sm:inline text-slate-500">Cần ôn:</span>
            <span id="statMistakesCount" class="font-bold text-rose-600">0</span>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="toggleSound()" id="btnSoundToggle" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl border border-slate-200 text-[11px] sm:text-xs font-bold text-slate-700 hover:bg-slate-100 transition-colors">
            🔊 Bật
          </button>
          <button onclick="printTestSheet()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-xl border border-slate-200 text-[11px] sm:text-xs font-bold text-slate-700 hover:bg-slate-100 transition-colors flex items-center gap-1">
            🖨️ In
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- NAVIGATION TABS (TOUCH-SCROLLABLE) -->
  <nav class="max-w-6xl mx-auto w-full px-3 pt-3 sm:px-6 sm:pt-4 no-print">
    <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-2 border-b border-slate-200">
      <button 
        data-tab="practice" 
        onclick="switchTab('practice')" 
        class="nav-tab-btn px-4 py-2.5 rounded-xl font-bold text-sm bg-emerald-700 text-white shadow-sm transition-all flex items-center gap-2 shrink-0"
      >
        <span>✏️ Luyện Tập Tự Do</span>
      </button>

      <button 
        data-tab="exam" 
        onclick="switchTab('exam')" 
        class="nav-tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-600 hover:text-emerald-700 hover:bg-emerald-50 transition-all flex items-center gap-2 shrink-0"
      >
        <span>⏱️ Thi Thử Tính Giờ</span>
      </button>

      <button 
        data-tab="mistakes" 
        onclick="switchTab('mistakes')" 
        class="nav-tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-600 hover:text-rose-700 hover:bg-rose-50 transition-all flex items-center gap-2 shrink-0"
      >
        <span>⚠️ Ôn Câu Sai</span>
        <span id="badgeMistakes" class="px-2 py-0.5 text-xs rounded-full bg-rose-100 text-rose-800 font-bold">0</span>
      </button>

      <button 
        data-tab="bookmarks" 
        onclick="switchTab('bookmarks')" 
        class="nav-tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-600 hover:text-amber-700 hover:bg-amber-50 transition-all flex items-center gap-2 shrink-0"
      >
        <span>⭐ Đã Lưu</span>
        <span id="badgeBookmarks" class="px-2 py-0.5 text-xs rounded-full bg-amber-100 text-amber-800 font-bold">0</span>
      </button>

      <button 
        data-tab="theory" 
        onclick="switchTab('theory')" 
        class="nav-tab-btn px-4 py-2.5 rounded-xl font-semibold text-sm text-slate-600 hover:text-emerald-700 hover:bg-emerald-50 transition-all flex items-center gap-2 shrink-0"
      >
        <span>📖 Sổ Tay Lý Thuyết</span>
      </button>
    </div>
  </nav>

  <!-- MAIN DYNAMIC CONTENT -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:px-6">
    <div id="viewContent">
      <!-- Injected by app.js -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-6 text-center text-xs text-slate-500 no-print">
    <div class="max-w-6xl mx-auto px-4">
      <p class="font-medium text-slate-700">Chuyên đề Hóa học: Phân bón vô cơ & hữu cơ - 79 câu trắc nghiệm chuẩn chương trình mới</p>
      <p class="mt-1">Thiết kế phục vụ học sinh ôn tập, thi đua và rèn luyện kiến thức hóa học.</p>
    </div>
  </footer>

  <!-- Floating Back to Top Button (Mobile & Desktop) -->
  <button 
    id="btnBackToTop" 
    onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
    title="Lên đầu trang"
    class="fixed bottom-5 right-5 z-50 p-3.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-2xl shadow-xl border border-emerald-500/30 transition-all opacity-0 pointer-events-none translate-y-3 flex items-center justify-center no-print"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
  </button>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Back to top scroll listener
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('btnBackToTop');
      if (btn) {
        if (window.scrollY > 350) {
          btn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
          btn.classList.add('opacity-100', 'translate-y-0');
        } else {
          btn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
          btn.classList.remove('opacity-100', 'translate-y-0');
        }
      }
    });
  </script>
</body>
</html>
